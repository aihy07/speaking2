<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#f7f8fa;padding:14px;max-width:750px;margin:0 auto;}
.card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 4px #00000018;margin:12px 0;}
button{padding:9px 15px;border-radius:6px;border:1px solid #bbb;margin:5px;cursor:pointer;font-size:15px;}
button.danger{background:#dc2626;color:#fff;border-color:#dc2626;}
button.big-race{width:100%;padding:26px;font-size:24px;background:#dc2626;color:#fff;border:none;border-radius:10px;}
input{width:100%;padding:11px;border-radius:6px;border:1px solid #bbb;margin:7px 0;font-size:16px;}
.name-item{padding:10px;border:1px solid #aaa;margin:5px;border-radius:6px;cursor:pointer;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>

<script>
let mqttClient=null;
const MQTT_TOPIC_PREFIX="hsk/classroom";
async function initMqtt(){
    const broker="wss://74a61de0e9c042f9aba1355a9edf8acd.s1.eu.hivemq.cloud:8884/mqtt";
    const username="aihuayu";
    const password="Huyu6180";
    const script=document.createElement("script");
    script.src="https://unpkg.com/mqtt/dist/mqtt.min.js";
    await new Promise(res=>{script.onload=res;document.head.appendChild(script);})
    const mqtt=window.mqtt;
    mqttClient=mqtt.connect(broker,{username,password,reconnectPeriod:3000});
    window.mqttClient=mqttClient;
    mqttClient.on("connect",()=>console.log("✅学生端HiveMQ已连接"));
    return mqttClient;
}
function mqttPublish(topic,payload){
    if(!mqttClient)return;
    mqttClient.publish(`${MQTT_TOPIC_PREFIX}/${topic}`,JSON.stringify(payload));
}
function mqttSub(topic,cb){
    if(!mqttClient)return;
    const full=`${MQTT_TOPIC_PREFIX}/${topic}`;
    mqttClient.subscribe(full);
    mqttClient.on("message",(t,msg)=>{
        if(t===full){try{cb(JSON.parse(msg.toString()))}catch(err){}}
    })
}

const studentList = [
"ALEKSEENKO DENIS","BAKAEVA MARGARITA","GODOVIKOV MATVEI","DUBININA VASILISA",
"ERSHOV KIRILL","ZEYNALOV FARIZ","KORCHUGANOV NIKITA","MNATSAKANIAN DAVID",
"NEPRINTSEVA ANNA","PARCHAK ANASTASIIA","SAFONOV PAVEL","SIMONOV DANIIL",
"AHMED RAAD","ABDULWAHID AL-RAHMANI"
];

let myName=null;
let myGroupNumber=null;

(async function(){
    await initMqtt();
    const app=document.querySelector("#app");

    mqttSub("battle/setup",payload=>{
        myGroupNumber=null;
        payload.groups.forEach((g,i)=>{
            if(g.includes(myName)) myGroupNumber=i+1;
        })
        renderMain();
    })
    mqttSub("battle/question",()=>{
        const btn=document.querySelector("#raceBtn");
        if(btn) btn.classList.remove("hidden");
    })
    mqttSub("exercise/push",payload=>{renderExercise(payload.mod)});
    mqttSub("exercise/next",payload=>{renderExercise(payload.mod)});

    function renderSelectName(){
        let html=`<div class="card"><h2>👩‍🎓学生端：请选择你的名字</h2>`;
        studentList.forEach(n=>{
            html+=`<div class="name-item" onclick="setStudent('${n}')">${n}</div>`
        })
        html+=`</div>`;
        app.innerHTML=html;
    }

    window.setStudent=function(name){
        myName=name;
        renderMain();
    }

    function renderMain(){
        app.innerHTML=`
        <div class="card">
            <h3>学生：${myName}</h3>
            <div>你的组别：<span id="groupText">${myGroupNumber?"第"+myGroupNumber+"组":"等待老师分组"}</span></div>
            <hr>
            <div class="card">
                <h4>🏆争霸赛</h4>
                <button id="raceBtn" class="big-race hidden" onclick="sendRap()">🔔抢答</button>
            </div>
            <div class="card">
                <h4>☁词云输入，可以多次提交</h4>
                <input id="wcInput" placeholder="在这里输入词语">
                <button onclick="submitWord()">提交</button>
            </div>
            <div id="exerciseBox" class="card">
                <h4>课上练习区域（等待老师推送题目）</h4>
            </div>
        </div>`;

        window.sendRap=()=>{
            mqttPublish("battle/rap",{name:myName});
            document.querySelector("#raceBtn").classList.add("hidden");
        }
        window.submitWord=()=>{
            const text=document.querySelector("#wcInput").value.trim();
            if(!text)return;
            mqttPublish("wc/submit",{name:myName,text:text});
            document.querySelector("#wcInput").value="";
        }
    }

    function renderExercise(mod){
        const box=document.querySelector("#exerciseBox");
        if(!box)return;
        switch(mod){
            case "singleGroup": box.innerHTML=`<h4>🔤单字组词</h4><p>请完成组词作答</p>`;break;
            case "flip":box.innerHTML=`<h4>🃏翻牌子</h4><p>观察生词，等待老师操作翻牌</p>`;break;
            case "listenWord":box.innerHTML=`<h4>🎧听音选生词</h4><input placeholder="输入听到的生词">`;break;
            case "pair":box.innerHTML=`<h4>🔗生词配对</h4><p>完成生词配对，不显示拼音</p>`;break;
            case "lianCi":box.innerHTML=`<h4>📜连词成句</h4><p>把词语排列成正确句子（无参考答案）</p>`;break;
            case "fill":box.innerHTML=`<h4>📋选词填空</h4><p>完成填空作答</p>`;break;
            case "findDiff":box.innerHTML=`<h4>👀大家来找茬</h4><p>找出图片不同之处</p>`;break;
        }
    }

    renderSelectName();
})();
</script>
</body>
</html>
