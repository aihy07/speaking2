<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师端｜完整课上练习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f7f8fa;padding:14px;max-width:1200px;margin:0 auto;}
.nav{background:#222;color:#fff;padding:12px;border-radius:8px;margin-bottom:14px;}
.card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 4px #00000018;margin:12px 0;}
button{padding:9px 15px;border-radius:6px;border:1px solid #bbb;margin:5px;cursor:pointer;font-size:15px;}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
button.success{background:#059669;color:#fff;border-color:#059669;}
button.danger{background:#dc2626;color:#fff;border-color:#dc2626;}
input,select{width:100%;padding:10px;border-radius:6px;border:1px solid #bbb;margin:7px 0;font-size:16px;}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:15px 0;}
.module-card{background:#fff;border:1px solid #cccccc;padding:16px;border-radius:8px;cursor:pointer;}
.hidden{display:none !important;}
.text-center{text-align:center;}
.battle-score{background:#111827;color:#fff;padding:12px;border-radius:8px;margin-bottom:10px;}
.word-cloud-box{min-height:240px;border:1px solid #aaa;padding:10px;background:#fff;}
.flip-wrap{width:280px;height:190px;perspective:700px;margin:20px auto;}
.flip-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:0.6s;}
.flip-card.flipped{transform:rotateY(180deg);}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:12px;border-radius:8px;font-size:28px;}
.face-front{background:#2563eb;color:white;}
.face-back{background:#fff;color:#111;transform:rotateY(180deg);border:1px solid #aaa;font-size:22px;}
.tile-fixed{display:inline-block;width:70px;height:70px;border:1px solid #333;line-height:70px;text-align:center;font-size:26px;margin:4px;border-radius:6px;user-select:none;}
</style>
</head>
<body>
<div id="app"></div>

<script>
let mqttClient=null;
const MQTT_TOPIC_PREFIX="hsk/classroom";
async function initMqtt(){
    const broker="wss://74a61de0e9c042f9aba1355a9edf8acd.s1.eu.hivemq.cloud:8884/mqtt";
    const username="aihuayu";
    const password="Huyu6180";
    const script=document.createElement("script");
    script.src="https://unpkg.com/mqtt/dist/mqtt.min.js";
    await new Promise(res=>{script.onload=res;document.head.appendChild(script);})
    const mqtt=window.mqtt;
    mqttClient=mqtt.connect(broker,{username,password,reconnectPeriod:3000});
    window.mqttClient=mqttClient;
    mqttClient.on("connect",()=>console.log("✅HiveMQ已连接，可以上课"));
    mqttClient.on("error",e=>console.error("❌MQTT错误",e));
    return mqttClient;
}
function mqttPublish(topic,payload){
    if(!mqttClient)return;
    mqttClient.publish(`${MQTT_TOPIC_PREFIX}/${topic}`,JSON.stringify(payload));
}
function mqttSub(topic,cb){
    if(!mqttClient)return;
    const full=`${MQTT_TOPIC_PREFIX}/${topic}`;
    mqttClient.subscribe(full);
    mqttClient.on("message",(t,msg)=>{
        if(t===full){try{cb(JSON.parse(msg.toString()))}catch(err){}}
    })
}

const studentList = [
"ALEKSEENKO DENIS","BAKAEVA MARGARITA","GODOVIKOV MATVEI","DUBININA VASILISA",
"ERSHOV KIRILL","ZEYNALOV FARIZ","KORCHUGANOV NIKITA","MNATSAKANIAN DAVID",
"NEPRINTSEVA ANNA","PARCHAK ANASTASIIA","SAFONOV PAVEL","SIMONOV DANIIL",
"AHMED RAAD","ABDULWAHID AL-RAHMANI"
];

const lesson4={
    words:[
        {w:"去",py:"qù",en:"v. to go"},{w:"过",py:"ɡuò",en:"part. 经历助词"},
        {w:"假期",py:"jià qī",en:"n. holiday"},{w:"以前",py:"yǐ qián",en:"n. before; ago"},
        {w:"地方",py:"dì fānɡ",en:"n. place"},{w:"订",py:"dìnɡ",en:"v. to order"},
        {w:"外卖",py:"wài mài",en:"n. takeout"},{w:"上网",py:"shànɡ wǎnɡ",en:"v. surf Internet"},
        {w:"家",py:"jiā",en:"m.量词"},{w:"菜",py:"cài",en:"n. dish"},
        {w:"辣",py:"là",en:"adj. spicy"},{w:"西餐厅",py:"xī cān tīnɡ",en:"n. western restaurant"},
        {w:"味道",py:"wèi dào",en:"n. taste"},{w:"送",py:"sònɡ",en:"v. deliver"},
        {w:"特别",py:"tè bié",en:"adj. particularly"},{w:"慢",py:"màn",en:"adj. slow"},
        {w:"有名",py:"yǒu mínɡ",en:"adj. famous"},{w:"没",py:"méi",en:"adv. not"},
        {w:"可以",py:"kě yǐ",en:"aux. can"},{w:"试",py:"shì",en:"v. try"}
    ],
    lianci:[
        {words:["我","去过","上海"],ans:"我去过上海"},
        {words:["以前","我","去过","北京"],ans:"以前我去过北京"},
        {words:["你","去过","什么地方"],ans:"你去过什么地方"},
        {words:["假期","我们","一起","去","杭州"],ans:"假期我们一起去杭州"},
        {words:["我","没去过","西餐厅"],ans:"我没去过西餐厅"},
        {words:["这个菜","味道","特别","辣"],ans:"这个菜味道特别辣"},
        {words:["我","想","订","外卖"],ans:"我想订外卖"},
        {words:["有名","这个地方","很"],ans:"这个地方很有名"},
        {words:["可以","你","试一试"],ans:"你可以试一试"},
        {words:["以前","我","经常","上网"],ans:"以前我经常上网"}
    ],
    fillBlank:Array.from({length:16},(_,idx)=>({q:"选词填空题目"+(idx+1),ans:"答案"+(idx+1)})),
    singleCharGroup:["去","过","菜","家","订","送","试","慢","辣"],
    flipCardWords:["假期","以前","地方","外卖","西餐厅","味道","有名","特别"],
    pairWords:[{w1:"假期",w2:"holiday"},{w1:"地方",w2:"place"},{w1:"外卖",w2:"takeout"}]
};

const mockStorage={
    get(key){const s=localStorage.getItem(key);try{return s?JSON.parse(s):null}catch{return null}},
    set(key,obj){localStorage.setItem(key,JSON.stringify(obj));},
    clearWordCloud(){this.set("wc",[])},
    getWordCloud(){return this.get("wc")||[]},
    saveWord(name,text){let arr=this.get("wc")||[];arr.push({name,text,ts:Date.now()});this.set("wc",arr);}
};

let appState={
    page:"home",
    battle:{groups:[],scores:{}},
    currentExercise:null
};

(async function run(){
    await initMqtt();
    const $=s=>document.querySelector(s);
    const app=$("#app");

    mqttSub("battle/rap",payload=>{
        const log=$("#battleLog");
        let gIdx=-1;
        appState.battle.groups.forEach((g,i)=>{if(g.includes(payload.name))gIdx=i;});
        log.innerHTML+=`<div>🚩抢到：${payload.name}｜第${gIdx+1}组
        <button onclick="addScore(${gIdx})">✅+10分</button>
        <button onclick="">❌不得分</button></div>`;
    })
    mqttSub("wc/submit",p=>{
        mockStorage.saveWord(p.name,p.text);
        renderWordCloud();
    })

    window.addScore=function(idx){
        appState.battle.scores[idx]+=10;
        renderBattleScorePanel();
    }
    window.switchPage=goPage;

    function goPage(pageName){
        appState.page=pageName;
        render();
    }

    function render(){
        let html=`
        <div class="nav">👨‍🏫教师端｜第4课 你去过上海吗？
        <button onclick="switchPage('home')">首页</button>
        <button onclick="switchPage('stat')">📊本课练习统计</button>
        </div>
        `;
        if(appState.page==="home"){
            html+=`
            <div class="card">
                <h2>📝课上练习（全部模块）</h2>
                <div class="module-grid">
                    <div class="module-card" onclick="switchPage('singleGroup')">🔤单字组词</div>
                    <div class="module-card" onclick="switchPage('flip')">🃏翻牌子</div>
                    <div class="module-card" onclick="switchPage('listenWord')">🎧听音选生词</div>
                    <div class="module-card" onclick="switchPage('pair')">🔗生词配对</div>
                    <div class="module-card" onclick="switchPage('lianCi')">📜连词成句</div>
                    <div class="module-card" onclick="switchPage('fill')">📋选词填空</div>
                    <div class="module-card" onclick="switchPage('findDiff')">👀大家来找茬</div>
                    <div class="module-card" onclick="switchPage('wordCloud')">☁词云</div>
                    <div class="module-card" onclick="switchPage('battle')">🏆争霸赛抢答</div>
                </div>
            </div>
            `
        }
        else if(appState.page==="stat"){
            html+=`<div class="card"><h2>📊本课练习统计页面</h2>
            <p>答题完成率、正确率、学生作答明细展示区域</p>
            <button onclick="switchPage('home')">返回课上练习</button>
            </div>`
        }
        else if(appState.page==="singleGroup"){
            const tiles=lesson4.singleCharGroup.map(ch=>`<span class="tile-fixed">${ch}</span>`).join("");
            html+=`
            <div class="card">
                <h3>🔤单字组词（选中汉字位置固定不移动）</h3>
                <div>${tiles}</div>
                <hr>
                <button class="success" onclick="pushExercise()">推送题目给学生</button>
                <button onclick="nextExercise()">下一题（自动同步学生端）</button>
                <button onclick="switchPage('home')">返回练习首页</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"singleGroup"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"singleGroup"});
        }
        else if(appState.page==="flip"){
            html+=`
            <div class="card">
                <h3>🃏翻牌子｜翻开只显示生词，不自动播放语音</h3>
                <div class="flip-wrap">
                    <div class="flip-card" id="fc">
                        <div class="face face-front">点击翻开</div>
                        <div class="face face-back">${lesson4.flipCardWords[0]}</div>
                    </div>
                </div>
                <button onclick="document.querySelector('#fc').classList.toggle('flipped')">教师点击翻牌</button>
                <button class="success" onclick="pushExercise()">推送</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"flip"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"flip"});
        }
        else if(appState.page==="listenWord"){
            html+=`
            <div class="card">
                <h3>🎧听音选生词｜学生端只有输入框，教师点击显示答案</h3>
                <div>生词音频播放区域</div>
                <div id="ansBox" class="hidden">✅参考答案：${lesson4.words[0].w}</div>
                <button onclick="document.querySelector('#ansBox').classList.remove('hidden')">教师点击展示答案</button>
                <button class="success" onclick="pushExercise()">推送题目</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"listenWord"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"listenWord"});
        }
        else if(appState.page==="pair"){
            html+=`
            <div class="card">
                <h3>🔗生词配对｜默认不出现拼音，点击生词播放读音</h3>
                <div>生词配对交互区域</div>
                <button class="success" onclick="pushExercise()">推送题目</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"pair"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"pair"});
        }
        else if(appState.page==="lianCi"){
            html+=`
            <div class="card">
                <h3>📜连词成句｜每题词语≥3个，词语打乱，判分忽略标点</h3>
                <div>词语拖拽排序区域</div>
                <div>参考答案：${lesson4.lianci[0].ans}</div>
                <button class="success" onclick="pushExercise()">推送题目</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"lianCi"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"lianCi"});
        }
        else if(appState.page==="fill"){
            html+=`
            <div class="card">
                <h3>📋选词填空（共${lesson4.fillBlank.length}道题目）</h3>
                <div>填空答题区域</div>
                <button class="success" onclick="pushExercise()">推送题目</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"fill"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"fill"});
        }
        else if(appState.page==="findDiff"){
            html+=`
            <div class="card">
                <h3>👀大家来找茬</h3>
                <div>图片对比找不同区域</div>
                <button class="success" onclick="pushExercise()">推送题目</button>
                <button onclick="nextExercise()">下一题同步学生端</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.pushExercise=()=>mqttPublish("exercise/push",{mod:"findDiff"});
            window.nextExercise=()=>mqttPublish("exercise/next",{mod:"findDiff"});
        }
        else if(appState.page==="wordCloud"){
            html+=`
            <div class="card">
                <h3>☁词云｜学生多次提交，教师一键清空</h3>
                <div class="word-cloud-box" id="wcDom"></div>
                <button class="danger" onclick="clearWC()">一键清空全部词云</button>
                <button onclick="switchPage('home')">返回</button>
            </div>`;
            window.clearWC=()=>{mockStorage.clearWordCloud();renderWordCloud();}
            renderWordCloud();
        }
        else if(appState.page==="battle"){
            html+=`
            <div class="card">
                <h3>🏆争霸赛抢答｜教师设置每组人数自动分组，学生不可自选队伍</h3>
                <div>每组学生人数：<input id="perNum" value="4" type="number"></div>
                <button class="primary" onclick="createGroups()">自动随机分组下发给学生端</button>
                <div class="battle-score" id="scorePanel"></div>
                <hr>
                <button class="success" onclick="pushBattleQ()">推送抢答题目</button>
                <div id="battleLog"></div>
                <button onclick="switchPage('home')">返回练习首页</button>
            </div>`;
            window.createGroups=()=>{
                const per=Number($("#perNum").value);
                const shuffle=[...studentList].sort(()=>Math.random()-0.5);
                const groups=[];
                for(let i=0;i<shuffle.length;){groups.push(shuffle.slice(i,i+per));i+=per;}
                appState.battle.groups=groups;
                appState.battle.scores={};
                groups.forEach((_,i)=>appState.battle.scores[i]=0);
                mqttPublish("battle/setup",{groups});
                renderBattleScorePanel();
                $("#battleLog").innerText="✅分组完成，已经下发到学生端";
            }
            window.pushBattleQ=()=>mqttPublish("battle/question",{});
            renderBattleScorePanel();
        }
        app.innerHTML=html;
    }

    function renderBattleScorePanel(){
        const panel=$("#scorePanel");
        if(!panel)return;
        let sHtml="<h4>各组得分排行</h4>";
        appState.battle.groups.forEach((g,i)=>{
            sHtml+=`<div>第${i+1}组｜分数：${appState.battle.scores[i]}｜成员：${g.join(", ")}</div>`
        })
        panel.innerHTML=sHtml;
    }
    function renderWordCloud(){
        const dom=$("#wcDom");
        if(!dom)return;
        const arr=mockStorage.getWordCloud();
        dom.innerText=arr.map(i=>i.text).join(" ");
    }

    render();
})();
</script>
</body>
</html>
