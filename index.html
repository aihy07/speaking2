<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>教师端 · 第4-6课练习+争霸赛</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC',sans-serif;background:#f0f6fb;min-height:100vh;display:flex}
.sidebar{width:230px;background:#fff;border-right:1px solid #e6edf4;padding:28px 20px;height:100vh;position:sticky;top:0;overflow-y:auto;flex-shrink:0;box-shadow:2px 0 16px rgba(0,0,0,.03)}
.sidebar h2{font-size:22px;font-weight:700;color:#1a2a3a;margin-bottom:24px}
.sidebar .course-selector{margin-bottom:28px}
.sidebar .course-selector .title{display:block;font-weight:600;color:#2c3e50;margin-bottom:8px;font-size:14px}
.multi-select{position:relative;width:100%}
.multi-select-trigger{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid #dce4ec;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#1a2a3a;transition:all .15s;user-select:none}
.multi-select-trigger:hover{border-color:#b0c0d0}
.multi-select-trigger.open{border-color:#3b7cff;box-shadow:0 0 0 3px rgba(59,124,255,.15)}
.multi-select-trigger .arrow{font-size:10px;color:#8a9aa8;transition:transform .2s}
.multi-select-trigger.open .arrow{transform:rotate(180deg)}
.multi-select-trigger .selected-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;text-align:left}
.multi-select-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:12px;border:1.5px solid #dce4ec;box-shadow:0 8px 24px rgba(0,0,0,.10);padding:6px;z-index:100}
.multi-select-dropdown.show{display:block;animation:ddFade .15s ease}
@keyframes ddFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#2c3e50;transition:background .1s}
.dropdown-item:hover{background:#f0f4f9}
.dropdown-item input{width:16px;height:16px;cursor:pointer;accent-color:#3b7cff;flex-shrink:0}
.dropdown-item.checked{background:#e0edff}
.dropdown-item.checked span{color:#3b7cff;font-weight:600}
.sidebar .module-list{display:flex;flex-direction:column;gap:4px}
.sidebar .module-btn{padding:12px 16px;border:none;border-radius:12px;background:transparent;color:#5a6c7d;font-weight:600;font-size:15px;text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.sidebar .module-btn:hover{background:#f0f4f9;color:#1a2a3a}
.sidebar .module-btn.active{background:#3b7cff;color:#fff;box-shadow:0 4px 14px rgba(59,124,255,.25)}
.sidebar .module-btn .icon{font-size:20px}
.sidebar .mqtt-status{margin-top:32px;padding:14px;background:#f0f4f9;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:12px}
.sidebar .mqtt-status .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sidebar .mqtt-status .dot.online{background:#0b6e4f}
.sidebar .mqtt-status .dot.offline{background:#b91c1c}
.sidebar .btn-connect{margin-top:10px;width:100%;padding:10px;border:none;border-radius:40px;background:#3b7cff;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.main{flex:1;padding:32px 40px;overflow-y:auto;height:100vh;background:#f0f6fb}
.main h1{font-size:28px;font-weight:700;color:#1a2a3a;margin-bottom:24px}
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.btn{padding:8px 22px;border:none;border-radius:40px;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s;background:#e9edf2;color:#1a2634;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#dce2ea;transform:translateY(-1px)}
.btn-primary{background:#3b7cff;color:#fff;box-shadow:0 4px 12px rgba(59,124,255,.25)}
.btn-success{background:#0b6e4f;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-outline{background:transparent;border:1.5px solid #dce4ec;color:#4a5b6c}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.flex-center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.mt-8{margin-top:8px}
.text-center{text-align:center}
.badge{background:#e9edf2;padding:4px 14px;border-radius:30px;font-size:13px;color:#4a5b6c}
.char-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:24px 0 32px;min-height:120px}
.char-btn{width:72px;height:72px;border-radius:18px;border:2px solid #dce4ec;background:#fff;font-size:30px;font-weight:700;color:#1a2a3a;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.char-btn:hover{background:#f0f4f9;border-color:#b0c0d0;transform:scale(1.02)}
.char-btn.selected{border-color:#3b7cff;background:#e0edff;box-shadow:0 0 0 4px rgba(59,124,255,.15)}
.progress-area{text-align:center;margin:8px 0 16px;font-size:16px;color:#5a6c7d}
.word-result{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:12px 0 20px}
.word-card{background:#fff;border-radius:16px;padding:14px 20px;border:1px solid #e6edf4;min-width:160px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.word-card .word{font-size:24px;font-weight:700;color:#1a2a3a}
.word-card .pinyin{font-size:14px;color:#5a6c7d;margin-top:2px}
.word-card .trans{font-size:13px;color:#6a7b8c;margin-top:2px}
.pair-area{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;padding:20px 0;flex-wrap:wrap}
.pair-col{flex:1;min-width:160px}
.pair-item{padding:12px 18px;margin-bottom:12px;border-radius:14px;border:1.5px solid #dce4ec;background:#fff;cursor:pointer;transition:.1s;font-weight:500;text-align:center}
.pair-item:hover{background:#f0f4f9}
.pair-item.active{border-color:#3b7cff;background:#e0edff}
.pair-item.matched{opacity:.3;pointer-events:none;border-color:#b8d9b0}
.pair-status{text-align:center;margin:12px 0;font-size:15px;color:#0b6e4f}
.pair-batch-info{text-align:center;font-size:15px;color:#5a6c7d;margin-bottom:12px}
.wordcloud-display{display:flex;flex-wrap:wrap;gap:16px 24px;padding:24px 16px;background:#fff;border-radius:24px;min-height:200px;border:2px dashed #dce4ec;justify-content:center;align-items:center}
.cloud-item{background:#f0f6fb;padding:10px 20px;border-radius:40px;border:1px solid #e6edf4;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.cloud-item .student{font-weight:700;color:#3b7cff}
.cloud-item .text{color:#1a2a3a}
.no-msg{color:#8a9aa8;font-size:16px}
.qr-section{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-bottom:20px;padding:16px 20px;background:#fff;border-radius:20px;border:1px solid #e6edf4}
.qr-section #qrCode{background:#fff;padding:12px;border-radius:16px;display:inline-block}
.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;justify-items:center;padding:20px 0}
.flip-card{width:100%;max-width:150px;aspect-ratio:1/1;perspective:800px;cursor:pointer}
.flip-card-inner{width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;position:relative}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;border:1px solid #e6edf4;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.flip-card-front{font-size:28px;font-weight:700;color:#1a2a3a}
.flip-card-back{transform:rotateY(180deg);background:#f8fbff}
.flip-card-back .pinyin{font-size:20px;font-weight:600;color:#3b7cff}
.flip-card-back .trans{font-size:14px;color:#5a6c7d;margin-top:4px}
.flip-card .cover{font-size:52px;color:#b0c0d0}
.fill-area{padding:20px 0}
.fill-sentence{font-size:26px;font-weight:600;color:#1a2a3a;margin-bottom:8px;line-height:2.2}
.fill-sentence .blank{display:inline-block;min-width:100px;padding:0 8px;border:2px dashed #3b7cff;border-radius:8px;background:#fff;color:#1a2a3a;font-weight:600;text-align:center;line-height:2;margin:0 6px}
.fill-translation{font-size:16px;color:#5a6c7d;margin-bottom:12px}
.fill-answer{font-size:16px;color:#0b6e4f;margin-top:8px;background:#e0f2e6;padding:8px 20px;border-radius:12px;display:inline-block}
.fill-controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.fill-student-answers{margin-top:24px;background:#fff;border-radius:18px;padding:18px 20px;border:1px solid #e6edf4;max-height:200px;overflow-y:auto}
.fill-student-answers .title{font-weight:600;color:#1a2a3a;margin-bottom:10px;font-size:16px}
.fill-student-answers .answer-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e6edf4;font-size:14px}
.fill-student-answers .answer-item .name{font-weight:500;color:#2c3e50}
.fill-student-answers .answer-item .ans{color:#0b6e4f}
.fill-student-answers .empty{color:#8a9aa8;font-size:14px;text-align:center;padding:12px 0}
.quiz-setup{background:#f8fafc;border-radius:20px;padding:24px;margin-bottom:20px;border:1px solid #e6edf4}
.quiz-setup h3{font-size:18px;color:#1a2a3a;margin-bottom:16px}
.quiz-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.quiz-row label{font-weight:600;color:#2c3e50}
.quiz-row input{padding:8px 14px;border-radius:12px;border:1.5px solid #dce4ec;font-size:15px;outline:none}
.quiz-absent-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.quiz-absent-item{padding:6px 14px;border-radius:20px;background:#fff;border:1.5px solid #dce4ec;cursor:pointer;font-size:14px;transition:.1s}
.quiz-absent-item:hover{border-color:#b0c0d0}
.quiz-absent-item.absent{background:#fee2e2;border-color:#fecaca;color:#991b1b;text-decoration:line-through}
.quiz-scoreboard{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.quiz-score-card{flex:1;min-width:180px;padding:16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.quiz-score-card .team-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.quiz-score-card .team-name{font-size:18px;font-weight:700}
.quiz-score-card .team-score{font-size:36px;font-weight:800}
.quiz-score-card .members{font-size:12px;color:#5a6c7d;line-height:1.5;word-break:break-word}
.quiz-score-card .members .member{padding:1px 6px;background:rgba(255,255,255,.6);border-radius:10px;display:inline-block;margin:1px}
.quiz-question{background:#fff;border-radius:20px;padding:28px;margin-bottom:20px;border:1px solid #e6edf4;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.quiz-question .q-content{font-size:26px;font-weight:700;color:#1a2a3a;line-height:2}
.quiz-question .q-extra{margin-top:12px;color:#5a6c7d;font-size:15px}
.quiz-question .q-words{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.quiz-question .q-word{background:#f0f6fb;padding:16px 28px;border-radius:16px;font-size:32px;font-weight:700;color:#1a2a3a;border:1px solid #e6edf4;text-align:center}
.quiz-question .blank{display:inline-block;min-width:80px;border-bottom:2px solid #3b7cff;margin:0 6px}
.quiz-buzz-info{background:#f8fafc;border-radius:20px;padding:20px;text-align:center;font-size:20px;font-weight:600;color:#1a2a3a;margin-bottom:16px;min-height:60px;display:flex;align-items:center;justify-content:center}
.quiz-buzz-info.buzzed{background:#fff4d6;color:#8a5a00}
.quiz-buzz-info.correct{background:#e0f2e6;color:#0b6e4f}
.quiz-buzz-info.wrong{background:#fee2e2;color:#991b1b}
.quiz-judge{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.quiz-wrong-groups{margin-top:8px;font-size:13px;color:#991b1b;text-align:center}

/* ===== 回音壁悬浮按钮 + 面板 ===== */
.echo-btn{position:fixed;right:24px;bottom:24px;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#3b7cff,#2a6ae0);color:#fff;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(59,124,255,.40);z-index:999;transition:all .2s}
.echo-btn:hover{transform:scale(1.08);box-shadow:0 10px 32px rgba(59,124,255,.5)}
.echo-btn:active{transform:scale(.95)}
.echo-btn .icon{font-size:26px;line-height:1}
.echo-btn .label{font-size:10px;font-weight:700;margin-top:2px;letter-spacing:1px}
.echo-panel{position:fixed;right:24px;bottom:104px;width:350px;max-height:calc(100vh - 140px);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.20);z-index:1000;display:none;overflow:hidden;flex-direction:column;animation:echoSlide .25s ease}
.echo-panel.show{display:flex}
@keyframes echoSlide{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.echo-header{padding:14px 18px;background:linear-gradient(135deg,#3b7cff,#2a6ae0);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.echo-close{background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:0 4px;opacity:.85}
.echo-close:hover{opacity:1}
.echo-body{padding:16px 18px;overflow-y:auto;flex:1}
.echo-qr{display:flex;justify-content:center;padding:12px;background:#f8fafc;border-radius:14px;margin-bottom:10px}
.echo-qr #echoQR{padding:8px;background:#fff;border-radius:10px;display:inline-block}
.echo-link{display:flex;gap:8px;align-items:center;background:#f0f4f9;padding:6px 12px;border-radius:10px;margin-bottom:14px;font-size:12px;color:#5a6c7d}
.echo-link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.echo-copy{background:#3b7cff;color:#fff;border:none;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.echo-copy:hover{background:#2a6ae0}
.echo-section{margin-bottom:14px}
.echo-label{font-size:12px;font-weight:700;color:#2c3e50;margin-bottom:6px}
.echo-course{display:flex;gap:8px;flex-wrap:wrap}
.echo-course label{display:flex;align-items:center;gap:4px;font-size:13px;color:#2c3e50;padding:5px 10px;background:#f0f4f9;border-radius:8px;cursor:pointer;transition:.15s}
.echo-course label:has(input:checked){background:#e0edff;color:#3b7cff;font-weight:600}
.echo-course input{accent-color:#3b7cff;cursor:pointer;width:14px;height:14px}
.echo-sync-btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#0b6e4f,#0a5a40);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 12px rgba(11,110,79,.25);transition:.15s}
.echo-sync-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(11,110,79,.4)}
.echo-sync-btn:active{transform:translateY(0)}
.echo-status{font-size:12px;text-align:center;min-height:18px;color:#0b6e4f;margin-bottom:10px;font-weight:600}
.echo-students{display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow-y:auto;padding:6px;background:#f8fafc;border-radius:10px;min-height:32px}
.echo-students .stu{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px;background:#fff;border:1px solid #e6edf4;border-radius:14px;font-size:12px;color:#2c3e50}
.echo-students .stu-remove{background:transparent;border:none;color:#dc2626;font-size:16px;cursor:pointer;font-weight:700;padding:0 4px;line-height:1}
.echo-students .stu-remove:hover{color:#991b1b}

@media (max-width:768px){
  .echo-panel{width:calc(100vw - 32px);right:16px;bottom:96px}
  .echo-btn{right:16px;bottom:16px;width:58px;height:58px}
  .echo-btn .icon{font-size:22px}
  .echo-btn .label{font-size:9px}
}
</style>
</head>
<body>
<div class="sidebar">
<h2>📘 练习中心</h2>
<div class="course-selector">
<div class="title">📖 选择课程内容</div>
<div class="multi-select">
<div class="multi-select-trigger" id="courseTrigger">
<span class="selected-text" id="courseSelectedText">全部课程</span>
<span class="arrow">▼</span>
</div>
<div class="multi-select-dropdown" id="courseDropdown">
<label class="dropdown-item"><input type="checkbox" class="course-check" value="lesson4" checked><span>第4课</span></label>
<label class="dropdown-item"><input type="checkbox" class="course-check" value="lesson5" checked><span>第5课</span></label>
<label class="dropdown-item"><input type="checkbox" class="course-check" value="lesson6" checked><span>第6课</span></label>
</div>
</div>
</div>
<div class="module-list">
<button class="module-btn active" data-module="word"><span class="icon">🧩</span>单字组词</button>
<button class="module-btn" data-module="pair"><span class="icon">🔗</span>词汇配对</button>
<button class="module-btn" data-module="cloud"><span class="icon">☁️</span>词云</button>
<button class="module-btn" data-module="flip"><span class="icon">🃏</span>翻牌子</button>
<button class="module-btn" data-module="fill"><span class="icon">✍️</span>选词填空</button>
<button class="module-btn" data-module="quiz"><span class="icon">🏆</span>争霸赛</button>
</div>
<div class="mqtt-status">
<span class="dot offline" id="mqttDot"></span>
<span id="mqttText">未连接</span>
</div>
<button class="btn-connect" id="mqttConnectBtn">连接 MQTT</button>
</div>

<div class="main">
<h1 id="pageTitle">🧩 单字组词</h1>

<div id="panel-word" class="panel active">
<div class="flex-center mt-8">
<button class="btn btn-success" id="newWordGroup">🔄 新的一组（5词）</button>
<span class="badge">本轮已练: <strong id="usedCount">0</strong> / <span id="totalCountDisplay">0</span> 词</span>
</div>
<div class="char-grid" id="charGrid"></div>
<div class="progress-area" id="progressMsg">点击汉字按顺序组成词语</div>
<div class="word-result" id="wordResult"></div>
<div class="text-center" id="wordCompleteMsg" style="font-weight:600;font-size:18px;color:#0b6e4f;"></div>
</div>

<div id="panel-pair" class="panel">
<div class="flex-center mt-8">
<button class="btn btn-success" id="newPairGroup">🔄 新的一组（5词）</button>
<span class="badge">本轮已练: <strong id="pairUsedCount">0</strong> / <span id="pairTotalCount">0</span> 词</span>
</div>
<div class="pair-batch-info" id="pairBatchInfo">点击左边词，再点击右边对应项配对</div>
<div class="pair-area">
<div class="pair-col" id="leftCol"></div>
<div class="pair-col" id="rightCol"></div>
</div>
<div class="pair-status" id="pairStatus">配对进度 0/5</div>
<div class="text-center" id="pairCompleteMsg" style="font-weight:600;font-size:18px;color:#0b6e4f;"></div>
</div>

<div id="panel-cloud" class="panel">
<div class="qr-section"><div id="qrCode"></div><div><strong>📱 学生扫码参与</strong><br>学生扫描二维码进入学生端，提交词汇。</div></div>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
<span style="font-weight:600;color:#1a2a3a;">📝 学生提交的词</span>
<button class="btn btn-outline" id="clearCloudBtn">🗑️ 清空所有</button>
</div>
<div class="wordcloud-display" id="cloudDisplay"><span class="no-msg">等待学生输入…</span></div>
</div>

<div id="panel-flip" class="panel">
<div class="flex-center mt-8">
<button class="btn btn-success" id="newFlipSet">🔄 新的一组（6词）</button>
<button class="btn btn-outline" id="flipAllBtn">🔃 全部翻转</button>
<button class="btn btn-outline" id="resetFlipBtn">↺ 重置</button>
</div>
<div class="flip-grid" id="flipGrid"></div>
</div>

<div id="panel-fill" class="panel">
<div class="fill-area">

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickWords(pool,usedSet,count=5){const av=pool.filter(w=>!usedSet.has(w.word));let s=[];if(av.length>=count)s=shuffle(av).slice(0,count);else{usedSet.clear();s=shuffle([...pool]).slice(0,count)}s.forEach(w=>usedSet.add(w.word));return s}

function segmentSentence(sentence, vocab) {
  const clean = sentence.replace(/[，。？、！；：""''（）\s]/g, '');
  const sortedVocab = [...new Set(vocab)].filter(w => w.length >= 1).sort((a, b) => b.length - a.length);
  const words = [];
  let i = 0;
  while (i < clean.length) {
    let matched = false;
    for (const word of sortedVocab) {
      if (clean.startsWith(word, i)) {
        words.push(word); i += word.length; matched = true; break;
      }
    }
    if (!matched) { words.push(clean[i]); i++; }
  }
  return words;
}

function updateMqttStatus(c){mqttConnected=c;mqttDot.className='dot '+(c?'online':'offline');mqttText.textContent=c?'已连接':'未连接';mqttBtn.textContent=c?'断开':'连接'}
function connectMqtt(){if(mqttClient&&mqttClient.isConnected()){mqttClient.disconnect();updateMqttStatus(false);return}

mqttClient.onMessageArrived=function(msg){
if(msg.destinationName===TOPIC_STUDENT_ANSWER){try{const d=JSON.parse(msg.payloadString);if(d.name&&d.answer){studentAnswers[d.name]=d.answer;renderStudentAnswers()}}catch(e){}}
else if(msg.destinationName===TOPIC_STUDENT_CLOUD){try{const d=JSON.parse(msg.payloadString);if(d.name&&d.text){addCloudItem(d.name,d.text);autoAddStudent(d.name);}}catch(e){}}
else if(msg.destinationName===TOPIC_QUIZ_BUZZ){handleQuizBuzz(JSON.parse(msg.payloadString))}};

function autoAddStudent(name){
  const students=getStudents();
  if(!students.find(s=>s.name===name)){
    students.push({name:name,points:0});
    saveStudents(students);
    renderTeacherPanel();
    updateEchoStudentList();
  }

function initQuizPools(){
  const cs=getSelectedCourses();
  if(cs.length===0){alert('请至少勾选一课');return false}
  const words=getWordPool().map(w=>w.word);
  const sents=getSentencePool();
  const quizSents=getQuizSentencePool();
  const uniqueWords=[...new Set(words)];
  quizPool20=[];
  const shuffledWords=shuffle([...uniqueWords]);
  let idx=0;
  for(let i=0;i<10;i++){const sel=[];for(let j=0;j<3;j++){if(idx>=shuffledWords.length){shuffle(shuffledWords);idx=0;}sel.push(shuffledWords[idx++]);}quizPool20.push(sel);}
  quizPool30=[];
  const shuffledSents=shuffle(sents.slice());idx=0;
  for(let i=0;i<10;i++){if(idx>=shuffledSents.length){shuffle(shuffledSents);idx=0;}quizPool30.push(shuffledSents[idx++]);}
  quizPool40=[];
  const shuffledQuizSents=shuffle(quizSents.slice());idx=0;
  for(let i=0;i<10;i++){if(idx>=shuffledQuizSents.length){shuffle(shuffledQuizSents);idx=0;}quizPool40.push(shuffledQuizSents[idx++]);}
  updateQuizPoolInfo();
  return true;
}

function generateQuizQuestion(points){
if(quizGroups.length===0){alert('请先开始争霸赛');return}
quizBuzzedGroups=new Set();quizWrongGroups=new Set();quizBuzzer=null;quizQuestionLocked=false;
let q=null;
if(points===20){
if(quizPool20.length===0){alert('20分题已用完');return}
const sel=quizPool20.shift();
q={type:'words_show',points,words:sel.map(w=>({word:w})),content:'请读出以下3个词：'};
}else if(points===30){
if(quizPool30.length===0){alert('30分题已用完');return}
const s=quizPool30.shift();
q={type:'fill',points,sentence:s.sentence,answer:s.answer,translation:s.translation,content:'选词填空'};
}else if(points===40){
if(quizPool40.length===0){alert('40分题已用完');return}
const s=quizPool40.shift();
if(Math.random()<0.5){q={type:'sentence_listen',points,sentence:s,content:'🔊 听句子，复述'};}
else{
  const words = segmentSentence(s, getWordPool().map(w => w.word));
  shuffle(words);
  q={type:'sentence_order',points,original:s,parts:words,content:'将词语按正确顺序排列：'};
}
}
quizCurrentQuestion=q;updateQuizPoolInfo();
document.getElementById('quizJudge').style.display='flex';
document.getElementById('quizBuzzInfo').className='quiz-buzz-info';
document.getElementById('quizBuzzInfo').textContent=quizPlayMode==='buzz'?'等待学生抢答…':'请老师指定学生回答';
document.getElementById('quizWrongGroups').textContent='';
renderQuizQuestion();
publishQuizState({type:'question',question:q,playMode:quizPlayMode});
const sel=document.getElementById('quizPickStudent');sel.innerHTML='<option value="">— 指定学生回答 —</option>';
quizGroups.forEach(g=>{g.members.forEach(m=>{const o=document.createElement('option');o.value=`${g.name}|${m}`;o.textContent=`${g.name} · ${m}`;sel.appendChild(o)})});
if(q.type==='sentence_listen'){setTimeout(()=>speakText(q.sentence),500)}
}

else if(q.type==='sentence_order'){html=`<div class="q-content">将词语按正确顺序排列：</div><div class="q-words" style="gap:20px;margin-top:24px;">${q.parts.map(p=>`<div class="q-word" style="font-size:32px;padding:16px 28px;text-align:center;">${p}</div>`).join('')}</div>`}
c.innerHTML=html}

function publishQuizState(data){if(!mqttConnected)return;const m=new Paho.MQTT.Message(JSON.stringify(data));m.destinationName=TOPIC_QUIZ_STATE;mqttClient.send(m)}

// ==================== 回音壁 ====================
const echoBtn=document.getElementById('echoBtn');
const echoPanel=document.getElementById('echoPanel');
const echoClose=document.getElementById('echoClose');
const echoSyncBtn=document.getElementById('echoSyncBtn');
const echoSyncStatus=document.getElementById('echoSyncStatus');
const echoStudentList=document.getElementById('echoStudentList');
const echoStudentCount=document.getElementById('echoStudentCount');
const echoLinkText=document.getElementById('echoLinkText');
const echoCopyLink=document.getElementById('echoCopyLink');
const echoQR=document.getElementById('echoQR');
let echoQRGenerated=false;

echoBtn.addEventListener('click',function(){
  echoPanel.classList.toggle('show');
  if(echoPanel.classList.contains('show')){
    if(!echoQRGenerated){generateEchoQR();echoQRGenerated=true;}
    updateEchoStudentList();
    echoLinkText.textContent=window.location.href.replace(/[^/]*$/,'')+'student.html';
    syncEchoCbsFromSidebar();
  }
});

echoClose.addEventListener('click',()=>echoPanel.classList.remove('show'));

function generateEchoQR(){
  const url=window.location.href.replace(/[^/]*$/,'')+'student.html';
  echoQR.innerHTML='';
  try{
    new QRCode(echoQR,{text:url,width:160,height:160,colorDark:'#1a2a3a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  }catch(e){echoQR.innerHTML='<div style="color:#a67c6a;padding:20px;">QR码生成失败</div>';}
}

echoCopyLink.addEventListener('click',function(){
  const url=echoLinkText.textContent;
  navigator.clipboard?.writeText(url).then(()=>{
    echoCopyLink.textContent='✓ 已复制';
    setTimeout(()=>echoCopyLink.textContent='复制',1500);
  }).catch(()=>{
    const input=document.createElement('input');input.value=url;document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();
    echoCopyLink.textContent='✓ 已复制';
    setTimeout(()=>echoCopyLink.textContent='复制',1500);
  });
});

// ★★★ 更新回音壁学生列表（带移除按钮）★★★
function updateEchoStudentList(){
  const students=getStudents();
  echoStudentCount.textContent=students.length;
  if(students.length===0){
    echoStudentList.innerHTML='<span style="color:#8a9aa8;font-size:13px;">暂无</span>';
  }else{
    echoStudentList.innerHTML=students.map(s=>
      `<span class="stu">${s.name}<button class="stu-remove" data-name="${s.name}" title="移除该学生">×</button></span>`
    ).join('');
  }
}

// 回音壁学生列表移除事件
echoStudentList.addEventListener('click',function(e){
  if(e.target.classList.contains('stu-remove')){
    const name=e.target.dataset.name;
    if(!confirm(`确定移除学生 "${name}" 吗？\n该学生将被要求重新加入课堂。`))return;
    let students=getStudents().filter(s=>s.name!==name);
    saveStudents(students);
    updateEchoStudentList();
    renderTeacherPanel();
    // 通知学生端
    if(mqttConnected){
      const m=new Paho.MQTT.Message(JSON.stringify({name:name}));
      m.destinationName=TOPIC_STUDENT_KICK;
      mqttClient.send(m);
    }
  }
});

function syncEchoCbsFromSidebar(){
  document.querySelectorAll('.course-check').forEach(cb=>{
    const echoCb=document.querySelector(`.echo-course-cb[value="${cb.value}"]`);
    if(echoCb)echoCb.checked=cb.checked;
  });
}

document.querySelectorAll('.echo-course-cb').forEach(cb=>{
  cb.addEventListener('change',function(){
    const checked=document.querySelectorAll('.echo-course-cb:checked');
    if(checked.length===0){this.checked=true;alert('请至少选择一课');return;}
    const sidebarCb=document.querySelector(`.course-check[value="${this.value}"]`);
    if(sidebarCb&&sidebarCb.checked!==this.checked){
      sidebarCb.checked=this.checked;
      sidebarCb.dispatchEvent(new Event('change'));
    }
  });
});

// ★★★ 回音壁同步按钮 ★★★
echoSyncBtn.addEventListener('click',function(){
  if(!mqttConnected){
    echoSyncStatus.textContent='⚠️ MQTT未连接，请先点击左侧「连接 MQTT」';
    echoSyncStatus.style.color='#b91c1c';
    setTimeout(()=>{echoSyncStatus.textContent='';},3500);
    return;
  }
  const active=document.querySelector('.module-btn.active')?.dataset.module;
  echoSyncStatus.textContent='';echoSyncStatus.style.color='#0b6e4f';

  if(active==='cloud'){
    // 通知学生切到词云模块
    const m=new Paho.MQTT.Message(JSON.stringify({mode:'cloud'}));
    m.destinationName=TOPIC_TEACHER_SYNC;
    mqttClient.send(m);
    echoSyncStatus.textContent='✅ 已同步：学生端切换到「☁️ 词云」';
  }else if(active==='fill'){
    const item=fillSentences[fillCurrentIndex];
    if(item){
      syncFillToStudent(item.sentence,item.answer,item.translation);
      echoSyncStatus.textContent='✅ 已同步：学生端切换到「✍️ 填空」';
    }else{
      echoSyncStatus.textContent='⚠️ 暂无填空题';
      echoSyncStatus.style.color='#b91c1c';
    }
  }else if(active==='quiz'){
    if(quizGroups.length>0){
      publishQuizState({type:'groups',groups:quizGroups.map(g=>({name:g.name,color:g.color,members:g.members}))});
      if(quizCurrentQuestion){
        setTimeout(()=>publishQuizState({type:'question',question:quizCurrentQuestion,playMode:quizPlayMode}),200);
      }
      echoSyncStatus.textContent='✅ 已同步：学生端切换到「🏆 争霸赛」';
    }else{
      echoSyncStatus.textContent='⚠️ 争霸赛尚未开始，请先到左侧「争霸赛」生成分组';
      echoSyncStatus.style.color='#b91c1c';
    }
  }else{
    echoSyncStatus.textContent='💡 该模块不需要同步（'+(titles[active]||active)+'）';
    echoSyncStatus.style.color='#7a5f50';
  }
  setTimeout(()=>{echoSyncStatus.textContent='';},3500);
});

// 面板显示时每 3 秒刷新学生列表
setInterval(()=>{if(echoPanel.classList.contains('show'))updateEchoStudentList();},3000);

initQuizAbsentList();
updateCourseTriggerText();
console.log('📘 教师端已加载（含回音壁+移除学生）');
</script>
